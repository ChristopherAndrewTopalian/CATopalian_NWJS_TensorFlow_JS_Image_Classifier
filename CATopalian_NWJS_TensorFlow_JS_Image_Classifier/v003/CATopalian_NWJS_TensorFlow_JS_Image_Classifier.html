<!DOCTYPE html>
<html lang="en">
<head>
<title> CATopalian NWJS TensorFlow JS Image Classifier </title>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body
{
    background-color: rgb(30, 30, 30);
    color: white;
    font-family: sans-serif;
    margin: 0;
    overflow: hidden; /* we will handle scrolling in the flex containers */
}

/* style the scrollbar for dark mode */
::-webkit-scrollbar {
    width: 8px;
}
::-webkit-scrollbar-track {
    background: rgb(20, 20, 20);
}
::-webkit-scrollbar-thumb {
    background: rgb(80, 80, 80);
    border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
    background: rgb(120, 120, 120);
}

</style>

<!-- TensorFlow & MobileNet Libraries -->
<!-- <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script> -->
<script src="src/js/0tensorFlow/tfjs.js"></script>

<!--
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script> -->
<script src="src/js/0tensorFlow/mobilenet.js"></script>

<script>

// Node.js File System Modules for NWJS
let fs = require('fs');
let path = require('path');

// shortcuts.js
function ge(whichId)
{
    let result = document.getElementById(whichId);
    return result;
}

function ce(whichType)
{
    let result = document.createElement(whichType);
    return result;
}

function ba(whichElement)
{
    let result = document.body.append(whichElement);
    return result;
}

function cl(whichMessage)
{
    let result = console.log(whichMessage);
    return result;
}

let dogKeywords = ["terrier", "retriever", "spaniel", "hound", "poodle", "shepherd", "bulldog", "collie", "dog", "puppy"];

// reads any specified directory and returns an array of valid image filenames
function getImagesFromDirectory(dirPath)
{
    let files = [];
    try
    {
        // read directory synchronously
        let allFiles = fs.readdirSync(dirPath);

        let allowedExts = ['.png', '.jpg', '.jpeg', '.webp', '.gif', '.bmp'];

        // filter for image extensions
        files = allFiles.filter(file => {
            let ext = path.extname(file).toLowerCase();
            return allowedExts.includes(ext);
        });
    }
    catch (err)
    {
        cl("Error reading folder: " + dirPath + " -> " + err);
    }
    return files;
}

async function runClassification(imgElement, outputElement, statusElement)
{
    statusElement.textContent = "Analyzing image...";
    statusElement.style.color = "yellow";

    // load the model
    let model = await mobilenet.load();

    // classify the image object
    let predictions = await model.classify(imgElement);

    // map against keywords
    let dogMatches = predictions.filter(p => dogKeywords.some(k => p.className.toLowerCase().includes(k)));

    // update the large title
    if (dogMatches.length > 0)
    {
        statusElement.textContent = "DOG DETECTED";
        statusElement.style.color = "lightgreen";
    }
    else
    {
        statusElement.textContent = "NO DOG DETECTED";
        statusElement.style.color = "salmon";
    }

    // print json results to the DOM
    outputElement.textContent = JSON.stringify(predictions, null, 2);
}

// populates the list of clickable thumbnail images
function populateThumbnails(folderPath, thumbContainer, mainImage, statusTitle, output)
{
    // empty existing thumbnails
    thumbContainer.innerHTML = "";

    let files = getImagesFromDirectory(folderPath);

    if (files.length > 0)
    {
        for (let i = 0; i < files.length; i++)
        {
            let imgPath = path.join(folderPath, files[i]);

            let thumb = ce("img");
            thumb.src = imgPath;
            thumb.title = files[i];
            thumb.style.width = "100%";
            thumb.style.cursor = "pointer";
            thumb.style.borderRadius = "5px";
            thumb.style.border = "2px solid transparent";
            thumb.style.transition = "border 0.2s";

            // hover effect
            thumb.onmouseover = function()
            {
                thumb.style.border = "2px solid white";
            };
            thumb.onmouseout = function()
            {
                thumb.style.border = "2px solid transparent";
            };

            // click event to load image to the right side
            thumb.onclick = function()
            {
                statusTitle.textContent = "Loading image...";
                statusTitle.style.color = "white";
                output.textContent = "";
                mainImage.src = imgPath;
            };

            thumbContainer.append(thumb);
        }

        // load the first image automatically
        statusTitle.textContent = "Loading image...";
        statusTitle.style.color = "white";
        output.textContent = "";
        mainImage.src = path.join(folderPath, files[0]);
    }
    else
    {
        let noFilesMsg = ce("p");
        noFilesMsg.textContent = "No images found in this folder.";
        noFilesMsg.style.fontSize = "13px";
        noFilesMsg.style.color = "#aaa";
        thumbContainer.append(noFilesMsg);
    }
}

function makeInterface()
{
    // Main Layout Wrapper
    let wrapper = ce("div");
    wrapper.style.display = "flex";
    wrapper.style.flexDirection = "row";
    wrapper.style.height = "100vh";
    ba(wrapper);

    // Left Column: Menu Container
    let leftMenu = ce("div");
    leftMenu.style.display = "flex";
    leftMenu.style.flexDirection = "column";
    leftMenu.style.width = "260px";
    leftMenu.style.minWidth = "260px";
    leftMenu.style.borderRight = "2px solid #555";
    leftMenu.style.backgroundColor = "rgb(20, 20, 20)";
    wrapper.append(leftMenu);

    // title
    let theTitle = ce('a');
    theTitle.id = 'theTitle';
    theTitle.href = 'https://github.com/ChristopherAndrewTopalian/CATopalian_NWJS_TensorFlow_JS_Image_Classifier';
    theTitle.target = '_blank';
    theTitle.textContent = 'CATopalian NWJS TensorFlow JS Image Classifier';
    theTitle.style.margin = '2px 8px';
    theTitle.style.fontFamily = 'Arial';
    theTitle.style.fontSize = '15px';
    theTitle.style.fontWeight = 'bold';
    theTitle.style.color = 'rgb(170, 170, 170)';
    theTitle.style.textDecoration = 'none';
    leftMenu.append(theTitle);

    // Top Action Bar in Left Column
    let menuHeader = ce("div");
    menuHeader.style.padding = "12px";
    menuHeader.style.borderBottom = "1px solid #444";
    leftMenu.append(menuHeader);

    // Hidden Folder Selector (NWJS nwdirectory attribute)
    let folderInput = ce("input");
    folderInput.type = "file";
    folderInput.setAttribute("nwdirectory", "");
    folderInput.style.display = "none";
    menuHeader.append(folderInput);

    // Styled Visible Button
    let chooseFolderBtn = ce("button");
    chooseFolderBtn.textContent = "Choose Folder";
    chooseFolderBtn.style.width = "100%";
    chooseFolderBtn.style.padding = "8px 12px";
    chooseFolderBtn.style.backgroundColor = "rgb(50, 50, 50)";
    chooseFolderBtn.style.color = "white";
    chooseFolderBtn.style.border = "1px solid #777";
    chooseFolderBtn.style.borderRadius = "4px";
    chooseFolderBtn.style.cursor = "pointer";
    chooseFolderBtn.style.fontWeight = "bold";

    chooseFolderBtn.onmouseover = function()
    {
        chooseFolderBtn.style.backgroundColor = "rgb(70, 70, 70)";
    };
    chooseFolderBtn.onmouseout = function()
    {
        chooseFolderBtn.style.backgroundColor = "rgb(50, 50, 50)";
    };

    // clicking the styled button clicks the hidden input
    chooseFolderBtn.onclick = function()
    {
        folderInput.click();
    };
    menuHeader.append(chooseFolderBtn);

    // Scrollable Thumbnails Container
    let thumbContainer = ce("div");
    thumbContainer.style.display = "flex";
    thumbContainer.style.flexDirection = "column";
    thumbContainer.style.gap = "15px";
    thumbContainer.style.padding = "12px";
    thumbContainer.style.overflowY = "auto";
    thumbContainer.style.flexGrow = "1";
    leftMenu.append(thumbContainer);

    // Right Column: Display & Output
    let rightContent = ce("div");
    rightContent.style.display = "flex";
    rightContent.style.flexDirection = "column";
    rightContent.style.padding = "5px";
    rightContent.style.flexGrow = "1";
    rightContent.style.overflowY = "auto";
    wrapper.append(rightContent);

    // Right Side Elements
    let mainImage = ce("img");
    mainImage.id = "mainImage";
    mainImage.style.maxWidth = "100%";
    mainImage.style.maxHeight = "300px";
    mainImage.style.objectFit = "contain";
    mainImage.style.backgroundColor = "black";
    mainImage.style.border = "1px solid #777";
    rightContent.append(mainImage);

    let statusTitle = ce("h1");
    statusTitle.id = "statusTitle";
    statusTitle.textContent = "Select an image...";
    statusTitle.style.marginTop = "5px";
    statusTitle.style.marginBottom = '4px';
    rightContent.append(statusTitle);

    let output = ce("pre");
    output.id = "output";
    output.textContent = "";
    output.style.backgroundColor = "rgb(20, 20, 20)";
    output.style.padding = "15px";
    output.style.borderRadius = "5px";
    output.style.border = "1px solid #555";
    output.style.marginTop = '0px';
    rightContent.append(output);

    // wait for image to load before classifying
    mainImage.onload = function()
    {
        if (mainImage.getAttribute("src"))
        {
            runClassification(mainImage, output, statusTitle);
        }
    };

    // listen for user choosing a new folder
    folderInput.onchange = function()
    {
        if (this.value)
        {
            populateThumbnails(this.value, thumbContainer, mainImage, statusTitle, output);
        }
    };

    // a cross-platform path by passing each folder as a separate string
    let defaultFolder = path.join('src', 'media', 'textures', 'textures_001');

    // load the default 'textures' folder on startup
    //populateThumbnails('src/media/textures/textures_001', thumbContainer, mainImage, statusTitle, output);

    // load the default folder on startup
    populateThumbnails(defaultFolder, thumbContainer, mainImage, statusTitle, output);
}

function whenLoaded()
{
    makeInterface();
}

</script>

</head>

<body onload = "whenLoaded()">

</body>

</html>
